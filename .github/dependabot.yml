# Commit messages follow Conventional Commits, so the release job decides
# what each update releases.
version: 2
updates:
  # Go modules are compiled into the binaries, so an update reaches users
  # only in a new release: fix(deps) publishes a patch.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      charm:
        patterns: ["github.com/charmbracelet/*"]

  # Workflow actions don't reach users: ci(deps) publishes nothing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
